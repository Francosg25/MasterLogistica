[project]
name = "masterlogistica-api"
version = "0.2.0"
description = "Internal shipments and freight audit API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "SQLAlchemy>=2.0.40,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "uvicorn[standard]>=0.34,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

