name: Backend validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docker_smoke:
        description: Also validate the optional Docker deployment
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  launcher:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -v
      - name: Check Windows command wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: INICIAR_LOCAL.cmd --help
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24.13.1'
      - name: Check native Windows build dependencies
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: frontend
        run: |
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          node scripts/check-toolchain.cjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: masterlogistica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-admin-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d masterlogistica_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci-disposable-admin-password@localhost:5432/masterlogistica_test
      TEST_DATABASE_URL: postgresql+psycopg://masterlogistica_app:ci-disposable-app-password@localhost:5432/masterlogistica_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r backend/requirements-test.lock
      - name: Create restricted disposable test role
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['TEST_ADMIN_DATABASE_URL'], hide_parameters=True)
          with engine.begin() as connection:
              connection.execute(text("CREATE ROLE masterlogistica_app LOGIN PASSWORD 'ci-disposable-app-password'"))
          engine.dispose()
          PY
      - run: ruff check backend scripts deploy/linux
      - run: ruff format --check backend scripts deploy/linux
      - run: python -m pytest -q
        working-directory: backend

  native-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nginx openssl
      - run: bash -n deploy/linux/install.sh deploy/linux/activate.sh
      - run: python scripts/smoke_native_server.py

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local container credentials
        run: python scripts/configure_local.py
      - name: Validate Compose and start API with migrations
        run: |
          docker compose config --quiet
          python scripts/local_dev.py start --mode docker --no-browser --timeout 180
          curl --retry 18 --retry-delay 5 --retry-connrefused --fail http://127.0.0.1:8000/health/ready
      - name: Stop local services without deleting data
        run: python scripts/local_dev.py stop --mode docker
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean disposable containers
        if: always()
        run: docker compose down -v
